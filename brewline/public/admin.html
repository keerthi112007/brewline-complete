<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Brewline admin</title>
<style>
  :root { --indigo:#1d1f52; --saffron:#ffb627; --line:#dcdcec; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f7f6fb; color: #17172e; }
  header { background: var(--indigo); color: #fff; padding: 1rem 5vw; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .8rem; }
  main { padding: 2rem 5vw; max-width: 1200px; margin: 0 auto; }
  input, button { font: inherit; padding: .6rem .9rem; border-radius: 8px; border: 2px solid var(--line); }
  button { background: var(--indigo); color: #fff; border-color: var(--indigo); cursor: pointer; font-weight: 600; }
  button.secondary { background: #fff; color: var(--indigo); }
  button.danger { background: #fff; color: #b3261e; border-color: #b3261e; padding: .3rem .7rem; }
  .bar { display: flex; gap: .7rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .bar input { flex: 1; min-width: 200px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 1rem; }
  .stat strong { display: block; font-size: 1.8rem; color: var(--indigo); }
  .wrap { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; min-width: 720px; }
  th, td { text-align: left; padding: .75rem 1rem; border-bottom: 1px solid var(--line); }
  th { background: #efeef8; }
  #msg { margin-top: 1rem; color: #b3261e; font-weight: 600; }
</style>
</head>
<body>
<header><strong>Brewline admin</strong><a href="/" style="color:#fff">View site</a></header>
<main>
  <div class="bar">
    <input type="password" id="token" placeholder="Admin token" aria-label="Admin token">
    <button id="load">Load leads</button>
    <button class="secondary" id="csv">Export CSV</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="bar"><input type="search" id="search" placeholder="Search name, email, plan or coffee" aria-label="Search leads"></div>
  <div class="wrap"><table>
    <thead><tr><th>Name</th><th>Email</th><th>Plan</th><th>Brew</th><th>Coffee</th><th>Date</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <p id="msg" role="status"></p>
</main>
<script>
const $ = id => document.getElementById(id);
let leads = [];
$('token').value = sessionStorage.getItem('adminToken') || '';
const headers = () => ({ 'x-admin-token': $('token').value });

async function load() {
  $('msg').textContent = '';
  sessionStorage.setItem('adminToken', $('token').value);
  const [l, s] = await Promise.all([fetch('/api/leads', { headers: headers() }), fetch('/api/subscribers', { headers: headers() })]);
  if (!l.ok) { $('msg').textContent = 'Wrong or missing admin token.'; return; }
  leads = await l.json();
  const subs = await s.json();
  renderStats(subs.length);
  render();
}

function renderStats(subCount) {
  const by = p => leads.filter(x => x.plan === p).length;
  const items = [['Total leads', leads.length], ['Solo', by('Solo')], ['Duo', by('Duo')], ['Office', by('Office')], ['Subscribers', subCount]];
  $('stats').innerHTML = '';
  items.forEach(([label, n]) => {
    const d = document.createElement('div'); d.className = 'stat';
    const b = document.createElement('strong'); b.textContent = n;
    d.append(b, label); $('stats').append(d);
  });
}

function render() {
  const q = $('search').value.toLowerCase();
  const list = leads.filter(l => [l.name, l.email, l.plan, l.coffee].join(' ').toLowerCase().includes(q));
  $('rows').innerHTML = '';
  list.slice().reverse().forEach(l => {
    const tr = document.createElement('tr');
    [l.name, l.email, l.plan, l.method, l.coffee || '-', new Date(l.createdAt).toLocaleString()].forEach(v => {
      const td = document.createElement('td'); td.textContent = v; tr.append(td);
    });
    const td = document.createElement('td');
    const del = document.createElement('button'); del.className = 'danger'; del.textContent = 'Delete';
    del.onclick = async () => {
      if (!confirm(`Delete lead from ${l.name}?`)) return;
      await fetch('/api/leads/' + l.id, { method: 'DELETE', headers: headers() });
      load();
    };
    td.append(del); tr.append(td); $('rows').append(tr);
  });
  if (!list.length) $('msg').textContent = leads.length ? 'No leads match your search.' : 'No leads yet.';
  else $('msg').textContent = '';
}

$('load').onclick = load;
$('search').oninput = render;
$('csv').onclick = async () => {
  const res = await fetch('/api/leads?format=csv', { headers: headers() });
  if (!res.ok) { $('msg').textContent = 'Wrong or missing admin token.'; return; }
  const url = URL.createObjectURL(await res.blob());
  const a = document.createElement('a'); a.href = url; a.download = 'brewline-leads.csv'; a.click();
  URL.revokeObjectURL(url);
};
if ($('token').value) load();
</script>
</body>
</html>
